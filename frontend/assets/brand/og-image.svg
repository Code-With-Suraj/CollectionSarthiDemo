<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="indigoGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Emblem Gradients -->
    <linearGradient id="ogEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="ogArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#indigoGlow)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 110)">
    
    <!-- BRAND LOGO & BADGE -->
    <g transform="translate(0, 0)">
      <!-- Emblem Icon -->
      <rect width="72" height="72" rx="18" fill="url(#ogEmblemGrad)" filter="url(#cardShadow)"/>
      <path d="M 43 18 C 28 18 18 26.5 18 36 C 18 45.5 28 54 43 54 C 48.5 54 53 52.2 56 49.5 L 51 44.5 C 49 46.2 46.5 47 43 47 C 32 47 26 41 26 36 C 26 31 32 25 43 25 C 46 25 48.5 25.8 50.5 27.5 L 55.5 22.5 C 52.5 19.8 48 18 43 18 Z" fill="#ffffff"/>
      <path d="M 34 38 L 52 20 M 52 20 L 40 20 M 52 20 L 52 32" stroke="url(#ogArrowGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="33" cy="39" r="3.5" fill="#fbbf24"/>

      <!-- Wordmark -->
      <text x="96" y="44" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-1">Collection<tspan fill="#818cf8">Sarthi</tspan></text>
      <circle cx="430" cy="40" r="5" fill="#34d399"/>
      <text x="98" y="66" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#94a3b8" letter-spacing="2.5">RECOVERY COMMAND CENTER</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="155" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" line-height="1.2">
      <tspan x="0" dy="0">Stop Chasing Payments.</tspan>
      <tspan x="0" dy="56" fill="#38bdf8">Recover Money on Autopilot.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="295" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Accounts Receivable, Aging Intelligence &amp; WhatsApp Follow-Ups for Indian SMBs.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 340)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">⚡ 1-Click WhatsApp</text>

      <!-- Pill 2 -->
      <rect x="235" y="0" width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="255" y="26" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">📊 30-60-90+ Aging</text>

      <!-- Pill 3 -->
      <rect x="470" y="0" width="210" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="490" y="26" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">🤝 PTP Commitment</text>

      <!-- Pill 4 -->
      <rect x="695" y="0" width="240" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="715" y="26" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">🔒 Private Sheets DB</text>
    </g>

    <!-- Footer Trust Tag -->
    <g transform="translate(0, 425)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">
        Created by WebSarthi • Powered by Suraj Automation • www.collectionsarthi.com
      </text>
    </g>

  </g>
</svg>
