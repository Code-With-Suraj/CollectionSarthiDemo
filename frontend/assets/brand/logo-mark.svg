<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="csBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="csAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="csGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>
    <filter id="csShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312e81" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Shield / Rounded Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#csBrandGrad)" />
  <!-- Inner Subtle Border Highlight -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="url(#csGlowGrad)" stroke-width="1" />

  <!-- Outer 'C' Wing / Chariot Arch -->
  <path d="M 28 12 C 18 12 12 17.5 12 24 C 12 30.5 18 36 28 36 C 31.5 36 34.5 34.8 36.5 33 L 33 29.5 C 31.8 30.8 29.8 31.5 28 31.5 C 21 31.5 17.2 27.5 17.2 24 C 17.2 20.5 21 16.5 28 16.5 C 30 16.5 32 17.2 33.2 18.5 L 36.8 15 C 34.5 13.2 31.5 12 28 12 Z" 
        fill="#ffffff" 
        filter="url(#csShadow)" />

  <!-- Dynamic Recovery Arrow & Sarthi Fin ('S' Ascent) -->
  <path d="M 22 25 L 34 13 M 34 13 L 26 13 M 34 13 L 34 21" 
        stroke="url(#csAccentGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Core Golden Recovery Focus Point -->
  <circle cx="21" cy="26" r="2.5" fill="#f59e0b" />
</svg>
