<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="logoArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="emblemShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- EMBLEM ICON (Left) -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#logoEmblemGrad)" filter="url(#emblemShadow)" />
    <!-- C curve -->
    <path d="M 24 10 C 15.5 10 10 14.8 10 20 C 10 25.2 15.5 30 24 30 C 27 30 29.5 29 31.2 27.5 L 28.5 24.8 C 27.2 25.8 25.8 26.2 24 26.2 C 18 26.2 14.5 22.8 14.5 20 C 14.5 17.2 18 13.8 24 13.8 C 25.8 13.8 27.2 14.3 28.2 15.2 L 31.2 12.5 C 29.5 11 27 10 24 10 Z" fill="#ffffff" />
    <!-- Recovery Arrow -->
    <path d="M 19 21 L 29 11 M 29 11 L 22 11 M 29 11 L 29 18" stroke="url(#logoArrowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sarthi amber dot -->
    <circle cx="18.5" cy="21.5" r="2" fill="#f59e0b" />
  </g>

  <!-- WORDMARK (Right) -->
  <!-- "Collection" in Deep Slate -->
  <text x="56" y="27" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Collection</text>
  <!-- "Sarthi" in Vivid Indigo -->
  <text x="146" y="27" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#4f46e5" letter-spacing="-0.5">Sarthi</text>
  <!-- Accent dot -->
  <circle cx="204" cy="26" r="2.5" fill="#10b981" />

  <!-- SUBTITLE -->
  <text x="56.5" y="39" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1.2">RECOVERY COMMAND CENTER</text>
</svg>
